<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>web_ui</title>
    <script type="module" crossorigin="" src="/assets/index-BUhHbpgt.js"></script>
    <link rel="stylesheet" crossorigin="" href="/assets/index-BuJbl4m4.css">

    <style>
      .trades-panel {
        margin-top: 2rem;
        padding: 1.5rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(0, 242, 255, 0.2);
        border-radius: 8px;
        color: white;
        font-family: 'Inter', sans-serif;
      }
      .trades-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
        font-size: 0.85rem;
      }
      .trades-table th {
        text-align: left;
        padding: 8px;
        color: #888;
        border-bottom: 1px solid #333;
      }
      .trades-table td {
        padding: 8px;
        border-bottom: 1px solid #222;
      }
      .text-buy { color: #39FF14; }
      .text-sell { color: #FF3131; }
      .text-cyan { color: #00F2FF; }
      .text-profit { color: #39FF14; font-weight: bold; }
      .text-loss { color: #FF3131; font-weight: bold; }
    </style>
</head>
  <body>
    <div id="root"></div>

    <script>
      // 10460: Dynamic Trade Overseer - Injected to bypass compiled React limitations
      (function() {
        const checkExist = setInterval(function() {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            clearInterval(checkExist);
            initTradeOverlay();
          }
        }, 100);

        function initTradeOverlay() {
          const container = document.createElement('div');
          container.className = 'trades-panel neo-border';
          container.style.maxWidth = '1200px';
          container.style.margin = '20px auto';
          container.innerHTML = `
            <div style="display: flex; align-items: center; gap: 10px; color: #00F2FF; margin-bottom: 15px;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
              <h2 style="font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Live Institutional Trades</h2>
            </div>
            <div id="trades-list-container" style="overflow-x: auto;">
              <table class="trades-table">
                <thead>
                  <tr>
                    <th>SYMBOL</th>
                    <th>TICKET</th>
                    <th>ACTION</th>
                    <th>LOTS</th>
                    <th>ENTRY</th>
                    <th>SL</th>
                    <th>TP</th>
                    <th>PL ($)</th>
                    <th>PL (PTS)</th>
                    <th>DURATION</th>
                    <th>STATUS</th>
                  </tr>
                </thead>
                <tbody id="trades-tbody">
                  <tr><td colspan="11" style="text-align: center; color: #555; padding: 20px;">Waiting for trade telemetry...</td></tr>
                </tbody>
              </table>
            </div>
          `;
          document.body.appendChild(container);

          // Connect to the same websocket
          const ws = new WebSocket(`ws://${window.location.hostname}:8009/ws`);
          ws.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              const trades = data.active_trades || [];
              const tbody = document.getElementById('trades-tbody');

              if (trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" style="text-align: center; color: #555; padding: 20px;">No active trades found.</td></tr>';
                return;
              }

              tbody.innerHTML = trades.map(t => {
                const plColor = t.pl_currency >= 0 ? 'text-profit' : 'text-loss';
                const actionClass = t.action === 'BUY' ? 'text-buy' : 'text-sell';
                const durMin = Math.floor(t.duration / 60);
                const durSec = Math.floor(t.duration % 60);

                return `
                  <tr>
                    <td><strong>${t.symbol}</strong></td>
                    <td style="color: #888;">${t.ticket}</td>
                    <td class="${actionClass}">${t.action}</td>
                    <td>${t.lots.toFixed(2)}</td>
                    <td>${t.entry_price.toFixed(5)}</td>
                    <td style="color: #FF7171;">${t.sl_price.toFixed(5)}</td>
                    <td style="color: #71FF71;">${t.tp_price.toFixed(5)}</td>
                    <td class="${plColor}">$${t.pl_currency.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td class="${plColor}">${t.pl_points.toFixed(1)}</td>
                    <td>${durMin}m ${durSec}s</td>
                    <td class="text-cyan">${t.status || 'OPEN'}</td>
                  </tr>
                `;
              }).join('');
            } catch (e) {
              console.error("Trade Overlay WS Error:", e);
            }
          };
        }
      })();
    </script>


</body></html>
