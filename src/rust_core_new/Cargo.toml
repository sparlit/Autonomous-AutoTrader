[package]
name = "aat_heavy"
version = "0.3.0"
edition = "2021"

[lib]
name = "aat_heavy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
rust_decimal = "1.35"
rust_decimal_macros = "1.35"
hashbrown = "0.14"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
